[package]
name = "filetap"
version = "0.0.1"
edition = "2024"
description = "See what files a command actually touches"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kq5y/filetap"
keywords = ["strace", "ptrace", "files", "trace", "debugging"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["ptrace", "signal", "process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
strip = true
